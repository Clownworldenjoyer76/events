name: Bandsintown Daily

on:
  workflow_dispatch:

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium --with-deps

      - name: Run Bandsintown collector
        run: python scripts/daily/bandsintown.py

      - name: Commit collected data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/events/raw/bandsintown

          if git diff --cached --quiet; then
            echo "REPO WRITE: NO CHANGES"
          else
            git commit -m "Update Bandsintown event data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "REPO WRITE: PASS"
          fi
