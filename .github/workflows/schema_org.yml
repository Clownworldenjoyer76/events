name: Schema.org Events

on:
  workflow_dispatch:

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests extruct

      - name: Run Schema.org collector
        run: python scripts/daily/schema_org.py

      - name: Commit collected Schema.org data
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/events/raw/schema_org

          if git diff --cached --quiet; then
            echo "REPO WRITE: NO CHANGES"
          else
            git commit -m "Update Schema.org event data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "REPO WRITE: PASS"
          fi