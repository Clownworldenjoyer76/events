name: TEC Events

on:
  workflow_dispatch:

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TEC collector
        run: python3 scripts/daily/tec.py

      - name: Commit collected TEC data
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/events/raw/tec

          if git diff --cached --quiet; then
            echo "REPO WRITE: NO CHANGES"
          else
            git commit -m "Update TEC event data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "REPO WRITE: PASS"
          fi